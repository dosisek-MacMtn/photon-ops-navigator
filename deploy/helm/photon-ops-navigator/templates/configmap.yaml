apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "photonops.fullname" . }}-config
  labels:
    {{- include "photonops.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  NETWORK_PROVIDER: {{ .Values.config.networkProvider | quote }}
  AI_PROVIDER: {{ .Values.config.aiProvider | quote }}
  AWS_REGION: {{ .Values.global.awsRegion | quote }}
  BEDROCK_MANTLE_BASE_URL: {{ .Values.config.bedrockMantleBaseUrl | quote }}
  BEDROCK_MODEL: {{ .Values.config.bedrockModel | quote }}
  CORS_ORIGINS: {{ printf "[\"%s\"]" .Values.config.allowedOrigin | quote }}
  AUTH_MODE: {{ .Values.auth.mode | quote }}
  ENTRA_TENANT_ID: {{ .Values.auth.tenantId | quote }}
  ENTRA_CLIENT_ID: {{ .Values.auth.clientId | quote }}
  ENTRA_API_CLIENT_ID: {{ .Values.auth.apiClientId | quote }}
  ENTRA_AUDIENCE: {{ default .Values.auth.apiClientId .Values.auth.audience | quote }}
  ENTRA_REQUIRED_SCOPE: {{ .Values.auth.requiredScope | quote }}
